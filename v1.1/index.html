<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Đoán Số v1.1 - Thử Thách Lượt Đoán</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>🎯 Đoán Số Bí Mật v1.1</h1>
    <p class="instruction">Máy đã chọn 1 số từ <strong>1 đến 100</strong>. Bạn có tối đa <strong>7 lượt đoán</strong>!</p>

    <!-- Thông tin lượt chơi -->
    <div class="stats-box">
      <span>Số lượt còn lại: <strong id="attempts-left">7</strong>/7</span>
    </div>

    <div class="input-box">
      <input type="number" id="user-guess" placeholder="Nhập số..." min="1" max="100">
      <button id="guess-btn">Đoán 🚀</button>
    </div>

    <!-- Thông báo kết quả -->
    <div id="message" class="message">Hãy thử nhập một số đi nào!</div>

    <!-- Lịch sử đoán số -->
    <div class="history-box">
      <h3>📜 Các số đã đoán:</h3>
      <div id="guess-history" class="history-tags">Chưa có</div>
    </div>

    <!-- Nút chơi lại -->
    <button id="restart-btn" class="hidden">Chơi ván mới 🔄</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
