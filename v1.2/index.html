<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Đoán Số v1.2 Pro Edition</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- MÀN HÌNH MENU CÀI ĐẶT -->
  <div id="menu-screen" class="container">
    <h1>🎯 Đoán Số v1.2 Pro</h1>
    <p class="subtitle">Thử thách trí tuệ & Tốc độ</p>

    <div class="form-group">
      <label for="max-number-input">Số tối đa để đoán (2 - 10,000):</label>
      <input type="number" id="max-number-input" value="100" min="2" max="10000">
    </div>

    <div class="form-group">
      <label for="time-limit-select">Thời gian suy nghĩ:</label>
      <select id="time-limit-select">
        <option value="0">Không giới hạn ♾️</option>
        <option value="30">30 Giây ⚡</option>
        <option value="60" selected>60 Giây ⏱️</option>
        <option value="120">120 Giây ⌛</option>
      </select>
    </div>

    <button id="start-btn" class="btn-main">Bắt đầu chơi 🚀</button>

    <!-- BẢNG KỶ LỤC -->
    <div class="high-score-box">
      <h3>🏆 Kỷ Lục Cá Nhân</h3>
      <p id="high-score-display">Chưa có kỷ lục nào!</p>
    </div>

    <!-- THÔNG TIN CHỦ QUYỀN -->
    <div class="copyright-box">
      <p>👑 <strong>Chủ quyền dự án:</strong> Phát triển bởi Khoai-Lang-20</p>
      <p>📅 Phiên bản: v1.2 Pro Edition</p>
    </div>
  </div>

  <!-- MÀN HÌNH TRÒ CHƠI -->
  <div id="game-screen" class="container hidden">
    <div class="game-header">
      <button id="back-menu-btn" class="btn-secondary">⬅️ Menu</button>
      <div id="timer-display" class="timer">⏳ --s</div>
    </div>

    <p class="instruction" id="game-instruction">Máy đã chọn 1 số từ 1 đến 100.</p>

    <div class="stats-box">
      <span>Còn lại: <strong id="attempts-left">7</strong> lượt</span>
    </div>

    <div class="input-box">
      <input type="number" id="user-guess" placeholder="Nhập số..." min="1">
      <button id="guess-btn">Đoán 🚀</button>
    </div>

    <!-- Thông báo kết quả -->
    <div id="message" class="message">Hãy thử nhập một số đi nào!</div>

    <!-- Lịch sử đoán -->
    <div class="history-box">
      <h3>📜 Các số đã đoán:</h3>
      <div id="guess-history" class="history-tags">Chưa có</div>
    </div>

    <button id="restart-btn" class="btn-main hidden">Chơi ván mới 🔄</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
